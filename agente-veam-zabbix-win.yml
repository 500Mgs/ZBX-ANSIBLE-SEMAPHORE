---
- name: Instalar Zabbix Agent 2 en Windows Server Veeam
  hosts: zabbix_windows_server
  gather_facts: false

  vars:
    zabbix_agent2_url: "https://cdn.zabbix.com/zabbix/binaries/stable/{{ zabbix_version }}/latest/zabbix_agent2-{{ zabbix_version }}-latest-windows-amd64-openssl.msi"
    zabbix_agent2_tmp: "C:\\Temp\\zabbix_agent2.msi"

  tasks:
    - name: Crear carpeta temporal
      ansible.windows.win_file:
        path: C:\Temp
        state: directory

    - name: Descargar MSI de Zabbix Agent 2
      ansible.windows.win_get_url:
        url: "{{ zabbix_agent2_url }}"
        dest: "{{ zabbix_agent2_tmp }}"

    - name: Instalar Zabbix Agent 2
      ansible.windows.win_package:
        path: "{{ zabbix_agent2_tmp }}"
        arguments: >-
          /qn
          SERVER={{ zabbix_proxy_ip }}
          SERVERACTIVE={{ zabbix_proxy_ip }}
          HOSTNAME={{ inventory_hostname }}
        state: present

    - name: Renderizar config de agente Windows en el nodo Ansible
      ansible.builtin.template:
        src: templates/zabbix_agente2_win.conf.j2
        dest: /tmp/zabbix_agent2_win_{{ inventory_hostname }}.conf
      delegate_to: localhost

    - name: Copiar configuración renderizada al Windows
      ansible.windows.win_copy:
        src: /tmp/zabbix_agent2_win_{{ inventory_hostname }}.conf
        dest: 'C:\Program Files\Zabbix Agent 2\zabbix_agent2.conf'

    - name: Reiniciar y habilitar servicio Zabbix Agent 2
      ansible.windows.win_service:
        name: "Zabbix Agent 2"
        state: restarted
        start_mode: auto

