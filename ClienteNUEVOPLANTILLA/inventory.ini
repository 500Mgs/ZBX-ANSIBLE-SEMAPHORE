# ============================================================
#  INVENTARIO — editar solo las IPs y usuarios por cliente
# ============================================================

[zabbix_proxies]
zbx-proxy ansible_host=PROXY_IP ansible_user=zabbix

[zabbix_agents]
# Añadir tantas líneas como agentes Linux haya
# agente-1 ansible_host=AGENTE_IP ansible_user=USUARIO_SSH

[windows]
# Añadir tantas líneas como agentes Windows haya
# win-1 ansible_host=WIN_IP

[zabbix_windows_server]
# Solo si hay servidor Veeam u otro Windows especial
# veeam-srv ansible_host=VEEAM_IP

# --- Salto SSH a través del proxy (no tocar la lógica) ---
[zabbix_agents:vars]
ansible_ssh_common_args='-o ProxyJump=zabbix@{{ zabbix_proxy_ip }}'

[windows:vars]
ansible_ssh_common_args='-o ProxyJump=zabbix@{{ zabbix_proxy_ip }}'

[zabbix_windows_server:vars]
ansible_ssh_common_args='-o ProxyJump=zabbix@{{ zabbix_proxy_ip }}'