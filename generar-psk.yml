---
- name: Generar clave SSH del cliente si no existe
  hosts: localhost
  connection: local
  gather_facts: false

  vars:
    cliente_id: "{{ cliente_id | default('cliente_sin_nombre') }}"
    ssh_key_dir: "/home/usuario/.ssh"
    ssh_key_path: "{{ ssh_key_dir }}/ansible_{{ cliente_id }}"

  tasks:
    - name: Crear carpeta de claves si no existe
      ansible.builtin.file:
        path: "{{ ssh_key_dir }}"
        state: directory
        mode: "0700"

    - name: Comprobar si ya existe la clave
      ansible.builtin.stat:
        path: "{{ ssh_key_path }}"
      register: ssh_key_stat

    - name: Generar par de claves SSH ed25519
      community.crypto.openssh_keypair:
        path: "{{ ssh_key_path }}"
        type: ed25519
        mode: "0600"
      when: not ssh_key_stat.stat.exists

    - name: Mostrar resultado
      ansible.builtin.debug:
        msg: >-
          {% if ssh_key_stat.stat.exists %}
          La clave ya existía en {{ ssh_key_path }} y no se ha modificado.
          {% else %}
          Clave SSH generada correctamente en {{ ssh_key_path }}.
          {% endif %}