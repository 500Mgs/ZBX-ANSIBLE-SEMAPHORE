---
- name: Instalar Zabbix Agent 2 en Debian 12
  hosts: zabbix_agents
  become: true

  vars:
    zabbix_version: "7"
    zabbix_release_deb: "https://cdn.zabbix.com/zabbix/binaries/stable/{{ zabbix_version }}/latest/zabbix_agent2-{{ zabbix_version }}-latest-windows-amd64-openssl.msi"

  tasks:
    - name: Instalar dependencias básicas
      ansible.builtin.apt:
        name:
          - wget
          - gnupg
        state: present
        update_cache: yes

    - name: Descargar repo oficial de Zabbix
      ansible.builtin.get_url:
        url: "{{ zabbix_release_deb }}"
        dest: /tmp/zabbix-release.deb
        mode: "0644"

    - name: Instalar repo Zabbix
      ansible.builtin.apt:
        deb: /tmp/zabbix-release.deb

    - name: Actualizar caché de paquetes
      ansible.builtin.apt:
        update_cache: yes

    - name: Instalar Zabbix Agent 2
      ansible.builtin.apt:
        name: zabbix-agent2
        state: present

    - name: Crear directorio de includes del agente
      ansible.builtin.file:
        path: /etc/zabbix/zabbix_agent2.d
        state: directory
        owner: root
        group: root
        mode: "0755"

    - name: Copiar configuración del agente
      ansible.builtin.template:
        src: templates/zabbix_agente2.conf.j2
        dest: /etc/zabbix/zabbix_agent2.conf
        owner: root
        group: root
        mode: "0644"

    - name: Habilitar y reiniciar zabbix-agent2
      ansible.builtin.systemd:
        name: zabbix-agent2
        enabled: yes
        state: restarted
