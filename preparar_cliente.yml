---
# ============================================================================
#  preparar-cliente.yml
#  Propósito: Genera PSK y clave SSH del cliente en el nodo Ansible.
#             Todo en local, sin tocar el proxy todavía.
#  Semaphore: Template "Preparar cliente" → Variable Group "Cliente <ID>"
#  Uso:       ansible-playbook preparar-cliente.yml
#             (sin inventario de cliente, solo necesita el Variable Group)
# ============================================================================

# ── PLAY 1: Guardia ──────────────────────────────────────────────────────────
- name: Validar variables de cliente
  hosts: localhost
  connection: local
  gather_facts: false

  tasks:
    - name: Comprobar que cliente_id está definido correctamente
      ansible.builtin.assert:
        that:
          - cliente_id is defined
          - cliente_id != ""
          - cliente_id != "cliente_sin_nombre"
        fail_msg: >
          ERROR: Carga el Variable Group del cliente antes de ejecutar.
          Necesitas cliente_id definido (p.ej. AMPROS).


# ── PLAY 2: PSK de Zabbix ────────────────────────────────────────────────────
- name: Generar PSK de Zabbix del cliente
  hosts: localhost
  connection: local
  gather_facts: false

  vars:
    psk_dir: "/home/usuario/zbx/psk"
    psk_path: "{{ psk_dir }}/ansible_{{ cliente_id }}.psk"

  tasks:
    - name: Asegurar que el directorio de PSK existe
      ansible.builtin.file:
        path: "{{ psk_dir }}"
        state: directory
        mode: "0700"

    - name: Comprobar si ya existe la PSK para este cliente
      ansible.builtin.stat:
        path: "{{ psk_path }}"
      register: psk_stat

    - name: Generar PSK aleatoria (solo si no existe)
      ansible.builtin.command:
        cmd: "openssl rand -hex 32"
      register: psk_generated
      when: not psk_stat.stat.exists
      changed_when: true

    - name: Guardar PSK en fichero del cliente
      ansible.builtin.copy:
        content: "{{ psk_generated.stdout }}"
        dest: "{{ psk_path }}"
        mode: "0600"
      when: not psk_stat.stat.exists

    - name: Leer PSK (nueva o existente)
      ansible.builtin.command:
        cmd: "cat {{ psk_path }}"
      register: psk_content
      changed_when: false

    - name: Mostrar resultado PSK
      ansible.builtin.debug:
        msg:
          - "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          - "  [PSK] Cliente: {{ cliente_id }}"
          - "  Ruta:   {{ psk_path }}"
          - "  Estado: {% if psk_stat.stat.exists %}Ya existía — no modificada{% else %}Nueva clave generada{% endif %}"
          - "  Valor (pegar en Zabbix Server → Proxies → Encryption):"
          - "  {{ psk_content.stdout }}"
          - "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"


# ── PLAY 3: Clave SSH de Ansible ─────────────────────────────────────────────
- name: Generar clave SSH del cliente para Ansible
  hosts: localhost
  connection: local
  gather_facts: false

  vars:
    ssh_dir: "/home/usuario/.ssh"
    ssh_key_path: "{{ ssh_dir }}/ansible_{{ cliente_id }}"

  tasks:
    - name: Comprobar si ya existe la clave SSH del cliente
      ansible.builtin.stat:
        path: "{{ ssh_key_path }}"
      register: ssh_stat

    - name: Generar par de claves SSH ed25519 (solo si no existe)
      ansible.builtin.command:
        cmd: >
          ssh-keygen -t ed25519
          -f {{ ssh_key_path }}
          -C "ansible-{{ cliente_id }}"
          -N ""
      when: not ssh_stat.stat.exists
      changed_when: true

    - name: Leer clave pública
      ansible.builtin.command:
        cmd: "cat {{ ssh_key_path }}.pub"
      register: pubkey_content
      changed_when: false

    - name: Mostrar resultado clave SSH
      ansible.builtin.debug:
        msg:
          - "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          - "  [SSH] Cliente: {{ cliente_id }}"
          - "  Clave privada: {{ ssh_key_path }}"
          - "  Clave pública: {{ ssh_key_path }}.pub"
          - "  Estado: {% if ssh_stat.stat.exists %}Ya existía — no modificada{% else %}Nuevo par generado{% endif %}"
          - "  Clave pública (se instalará en el proxy en el siguiente paso):"
          - "  {{ pubkey_content.stdout }}"
          - "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"


# ── PLAY 4: Provisionamiento de objetos en Semaphore ─────────────────────────
- name: Crear objetos del cliente en Semaphore mediante API
  hosts: localhost
  connection: local
  gather_facts: false

  vars:
    # La URL final será: http://semaphore.local/api/project/1
    semaphore_project_api: >-
      {{ semaphore_api_url }}/project/{{ semaphore_project_id }}

    semaphore_api_token_effective: >
      {{ lookup('ansible.builtin.env', 'semaphore_api_token') | trim }}

    semaphore_auth_headers:
      Authorization: >-
        Bearer {{ lookup('ansible.builtin.env', 'semaphore_api_token') | trim }}
      Content-Type: "application/json"

    # Ruta que ya creó el Play 3.
    ssh_key_path: "/home/usuario/.ssh/ansible_{{ cliente_id }}"

    # Ruta que ya creó el Play 2.
    psk_path: "/home/usuario/zbx/psk/ansible_{{ cliente_id }}.psk"

    # Variables persistentes del cliente que se guardarán en el Environment.
    # IMPORTANTE: ajusta los nombres exactos a las variables reales de tus playbooks.
    client_extra_vars:
      cliente_id: "{{ cliente_id }}"

      # Zabbix
      zabbix_version: "{{ zabbix_version | default('7.4') }}"
      zabbix_server_ip: "{{ zabbix_server_ip | default('192.168.0.119') }}"
      zabbix_proxy_ip: "{{ zabbix_proxy_ip }}"
      zabbix_proxy_hostname: "zbx-proxy-{{ cliente_id }}"
      zabbix_proxy_mode: "{{ zabbix_proxy_mode | default('0') }}"
      zabbix_proxy_dbfile: >-
        {{ zabbix_proxy_dbfile | default('/var/lib/zabbix/proxy.db') }}

      # PSK del proxy
      tls_proxy_psk_src: "{{ psk_path }}"
      tls_proxy_psk_file: "/etc/zabbix/tls/proxy.psk"
      tls_proxy_identity: "proxy-{{ cliente_id }}"

      # Acceso SSH al proxy
      proxy_user: "{{ proxy_user | default('ansible') }}"
      proxy_key_path: "{{ ssh_key_path }}"

      # Máquina virtual del proxy
      vm_name: "zbx-proxy-{{ cliente_id }}"
      vm_ip: "{{ zabbix_proxy_ip }}"
      vm_prefix: "{{ vm_prefix | default(24) }}"
      vm_gateway: "{{ vm_gateway }}"
      vm_dns: "{{ vm_dns | default('8.8.8.8') }}"

      # Host Hyper-V
      hyperv_host_ip: "{{ hyperv_host_ip }}"

      # Parámetros de la VM Hyper-V.
      hypervvmrammb: "{{ hypervvmrammb | default(2048) }}"
      hypervvmcpu: "{{ hypervvmcpu | default(2) }}"
      hypervvmpath: "{{ hypervvmpath | default('C:\\VM') }}"
      hypervvhdxpath: >-
        {{ hypervvhdxpath | default(
          'C:\\VM\\zbx-proxy-' ~ cliente_id ~
          '\\zbx-proxy-' ~ cliente_id ~ '.vhdx'
        ) }}
      hypervvswitch: "{{ hypervvswitch | default('NIC-Externa') }}"

      # Credenciales Hyper-V y Windows.
      hyperv_user: "{{ hyperv_user }}"
      hyperv_password: "{{ hyperv_password }}"
      ansible_user: "{{ windows_admin_user }}"
      ansible_password: "{{ windows_admin_password }}"

    # Inventario estático que quedará guardado en Semaphore.
    inventory_text: |
      [zabbix_proxies]
      zbx-proxy-{{ cliente_id }} ansible_host={{ zabbix_proxy_ip }} ansible_user={{ proxy_user | default('ansible') }}

      [hypervhost]
      zbx-hyperv-{{ cliente_id }} ansible_host={{ hyperv_host_ip }}

      [windows]
      {% for line in (windows_hosts | default('')).splitlines() if line | trim %}
      {{ (line.split(',', 1)[0] | trim) }} ansible_host={{ (line.split(',', 1)[1] | trim) }}
      {% endfor %}

      [windows:vars]
      ansible_ssh_common_args='-o ProxyJump={{ proxy_user | default("ansible") }}@{{ zabbix_proxy_ip }}'

  tasks:
    - name: Validar variables de infraestructura Semaphore
      ansible.builtin.assert:
        that:
          - semaphore_api_url is defined
          - semaphore_api_url | length > 0
          - semaphore_project_id is defined
          - semaphore_repository_id is defined
          - semaphore_api_token_effective | length > 0
        fail_msg: >
          Falta el token de API de Semaphore. Comprueba que el secreto
          semaphore_api_token existe en Semaphore-Bootstrap.
      no_log: true

    - name: Validar datos recibidos desde el Survey
      ansible.builtin.assert:
        that:
          - zabbix_proxy_ip is defined
          - zabbix_proxy_ip | length > 0
          - hyperv_host_ip is defined
          - hyperv_host_ip | length > 0
          - vm_gateway is defined
          - vm_gateway | length > 0
          - hyperv_user is defined
          - hyperv_user | length > 0
          - hyperv_password is defined
          - hyperv_password | length > 0
          - windows_admin_user is defined
          - windows_admin_user | length > 0
          - windows_admin_password is defined
          - windows_admin_password | length > 0
        fail_msg: >-
          Faltan datos del Survey. Revisa zabbix_proxy_ip,
          hyperv_host_ip, vm_gateway, windows_hosts y
          windows_admin_password.

    - name: Comprobar que existe la clave SSH generada en el Play 3
      ansible.builtin.stat:
        path: "{{ ssh_key_path }}"
      register: ssh_private_key_stat

    - name: Detener si no existe la clave privada SSH
      ansible.builtin.assert:
        that:
          - ssh_private_key_stat.stat.exists
        fail_msg: >-
          No existe {{ ssh_key_path }}. El Play 3 no generó correctamente
          la clave SSH del cliente.

    - name: Leer la clave privada SSH del cliente
      ansible.builtin.slurp:
        src: "{{ ssh_key_path }}"
      register: ssh_priv_key_raw
      no_log: true

    - name: Consultar Environments existentes
      ansible.builtin.uri:
        url: "{{ semaphore_project_api }}/environment"
        method: GET
        headers: "{{ semaphore_auth_headers }}"
        return_content: true
        status_code: 200
      register: semaphore_environments
      no_log: false

    - name: Detener si ya existe el Environment del cliente
      ansible.builtin.assert:
        that:
          - >-
            (
              semaphore_environments.json
              | selectattr('name', 'equalto', 'Cliente_' ~ cliente_id)
              | list
              | length
            ) == 0
        fail_msg: >-
          Ya existe Cliente_{{ cliente_id }} en Semaphore. No se continúa
          para evitar duplicados. Comprueba si el cliente ya fue creado o
          limpia los objetos creados en un intento fallido anterior.

    - name: Crear Environment del cliente
      ansible.builtin.uri:
        url: "{{ semaphore_project_api }}/environment"
        method: POST
        headers: "{{ semaphore_auth_headers }}"
        body_format: json
        body:
          name: "Cliente_{{ cliente_id }}"
          project_id: "{{ semaphore_project_id }}"
          json: "{{ client_extra_vars | to_json }}"
          env: "{}"
        return_content: true
        status_code: [200, 201]
      register: env_result
      no_log: true

    - name: Crear credencial SSH del cliente en Key Store
      ansible.builtin.uri:
        url: "{{ semaphore_project_api }}/keys"
        method: POST
        headers: "{{ semaphore_auth_headers }}"
        body_format: json
        body:
          name: "SSH_{{ cliente_id }}"
          project_id: "{{ semaphore_project_id }}"
          type: "ssh"
          ssh:
            login: "{{ proxy_user | default('ansible') }}"
            passphrase: ""
            private_key: "{{ ssh_priv_key_raw.content | b64decode }}"
        return_content: true
        status_code: [200, 201]
      register: key_result
      no_log: true

    - name: Diagnóstico - confirmar ID de Key Store
      ansible.builtin.debug:
        msg:
          - "Key Store creado: SSH_{{ cliente_id }}"
          - "Key ID recibido: {{ key_result.json.id }}"
          - "Tipo del ID: {{ key_result.json.id | type_debug }}"
      no_log: false
    
    - name: Diagnóstico - mostrar inventario que se enviará
      ansible.builtin.debug:
        msg: "{{ inventory_text }}"
      no_log: false

    - name: Diagnóstico - campos del Inventory API
      ansible.builtin.debug:
        msg:
          name: "Inventory_{{ cliente_id }}"
          project_id: "{{ semaphore_project_id | int }}"
          type: "static"
          ssh_key_id: "{{ key_result.json.id | int }}"
          inventory_length: "{{ inventory_text | length }}"
      no_log: false
    
    - name: Crear Inventory estático del cliente
      ansible.builtin.uri:
        url: "{{ semaphore_project_api }}/inventory"
        method: POST
        headers: "{{ semaphore_auth_headers }}"
        body_format: json
        body: >-
          {{
            {
              'name': 'Inventory_' ~ cliente_id,
              'project_id': semaphore_project_id | int,
              'type': 'static',
              'inventory': inventory_text,
              'ssh_key_id': key_result.json.id | int
            } | to_json
          }}
        return_content: true
        status_code: [200, 201]
      register: inv_result
      no_log: true

    - name: Crear Task Templates del cliente
      ansible.builtin.uri:
        url: "{{ semaphore_project_api }}/templates"
        method: POST
        headers: "{{ semaphore_auth_headers }}"
        body_format: json
        body:
          project_id: "{{ semaphore_project_id }}"
          repository_id: "{{ semaphore_repository_id }}"
          inventory_id: "{{ inv_result.json.id }}"
          environment_id: "{{ env_result.json.id }}"
          name: "{{ item.name }} - {{ cliente_id }}"
          playbook: "{{ item.playbook }}"
          arguments: "[]"
        return_content: true
        status_code: [200, 201]
      loop:
        - name: "Desplegar Proxy"
          playbook: "tunnel_hyperv_proxy_VM.yml"
        - name: "Agentes Linux"
          playbook: "agente-zabbix.yml"
        - name: "Agentes Windows"
          playbook: "agente-zabbix-win.yml"
        - name: "Agente Veeam"
          playbook: "agente-veam-zabbix-win.yml"
      loop_control:
        label: "{{ item.name }} - {{ cliente_id }}"
      register: template_result

    - name: Mostrar resumen del aprovisionamiento
      ansible.builtin.debug:
        msg:
          - "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          - "Cliente {{ cliente_id }} aprovisionado en Semaphore"
          - "Environment: Cliente_{{ cliente_id }} (ID {{ env_result.json.id }})"
          - "Key Store: SSH_{{ cliente_id }} (ID {{ key_result.json.id }})"
          - "Inventory: Inventory_{{ cliente_id }} (ID {{ inv_result.json.id }})"
          - "Templates creadas: {{ template_result.results | length }}"
          - "Siguiente paso: ejecutar Desplegar Proxy - {{ cliente_id }}"
          - "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"